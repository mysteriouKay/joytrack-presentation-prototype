document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('roleMenu').classList.remove('open');go(b.dataset.go)}));
document.querySelector('#help button').addEventListener('click',()=>document.getElementById('help').classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}else if(e.key.toLowerCase()==='d'){theme=theme==='light'?'dark':'light';render()}else if(e.key.toLowerCase()==='a')go(7);else if(e.key.toLowerCase()==='t')go(3);else if(e.key==='?')document.getElementById('help').classList.toggle('open');else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}else if(e.key==='Escape')document.getElementById('roleMenu').classList.remove('open')});
function showHint(){hint.textContent='Choose an actor to open the Teacher or Admin dashboard. Use Full screen for readable text; open Create screens to try the forms.';hint.classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.remove('show'),4500)}
image.addEventListener('error',()=>{hint.textContent='This screen could not be loaded. Use the arrow keys to continue.';hint.classList.add('show')});render();showHint();
</script></body></html>
